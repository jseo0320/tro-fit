name: tro-fit
services:
  postgres:
    build:
      context: ./deploy
      dockerfile: postgres.Dockerfile
    image: tro-fit-postgres:16-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.40.0
    volumes:
      - ollama_state:/root/.ollama
      - type: bind
        source: ${OLLAMA_MODELS_PATH:?}/blobs
        target: /root/.ollama/models/blobs
        read_only: true
      - type: bind
        source: ${OLLAMA_MODELS_PATH:?}/manifests
        target: /root/.ollama/models/manifests
        read_only: true
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_NOPRUNE: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  llm:
    build: ./tro-fit-llm
    image: tro-fit-llm:latest
    env_file:
      - path: ./deploy/llm.env
        format: raw
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      postgres: {condition: service_healthy}
      ollama: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  backend:
    build: ./tro-fit-backend
    image: tro-fit-backend:latest
    env_file:
      - path: ./deploy/backend.env
        format: raw
    environment:
      LLM_BASE_URL: http://llm:8001
    depends_on:
      postgres: {condition: service_healthy}
      llm: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  frontend:
    build: ./tro-fit-frontend/frontend
    image: tro-fit-frontend:latest
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
volumes:
  ollama_state:
  pgdata:
    external: true
    name: ${POSTGRES_VOLUME:?}
